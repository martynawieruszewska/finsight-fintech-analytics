[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.5",
    "numpy==2.5.2",
    "matplotlib==3.11.1",
    "scikit-learn==1.9.0",
    "SQLAlchemy==2.0.52",
    "psycopg2-binary==2.9.12",
    "pyarrow==25.0.1",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
    "jupyterlab==4.6.3",
]

[tool.setuptools.packages.find]
where = ["src"]